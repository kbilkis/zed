name: personal build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"
    - cron: "0 5 15 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: sync with latest stable release and rebuild patches
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch upstream main --tags --no-recurse-submodules
          BASE=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "basing on $BASE"
          git rebase "$BASE"
          git push --force-with-lease origin personal

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: build
        run: ./script/bundle-mac

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date +%Y.%-m.%-d).${{ github.run_number }}"
          gh release create "$TAG" --repo kbilkis/zed \
            target/aarch64-apple-darwin/release/Zed-aarch64.dmg \
            --title "Zed-wrap $TAG" --latest \
            --notes "Zed-wrap build: latest stable Zed release + tab wrapping (tab_bar.wrap_tabs) + GitHub auto-update."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zed-dmg
          path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
